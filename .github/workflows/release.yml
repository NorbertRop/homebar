name: Release

# Tag a commit to publish a build, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Produces a *draft* GitHub Release with HomeBar.zip attached for you to review,
# fill in notes, and publish. Builds are ad-hoc signed (not notarized) for now.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build & draft release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: swift test

      - name: Build & bundle HomeBar.app
        run: bash Scripts/package-app.sh release

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent build/HomeBar.app build/HomeBar.zip

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          files: build/HomeBar.zip
          draft: true
          generate_release_notes: true
